name: Linux CI

on: [push, pull_request]

jobs:
  build:

    runs-on: ubuntu-22.04

    steps:
    - uses: actions/checkout@v2
    - name: install-packages
      run: |
        sudo apt-get update
        sudo apt-get install build-essential libbz2-dev libfftw3-dev libfishsound1-dev libid3tag0-dev libmad0-dev liboggz2-dev libopus-dev libopusfile-dev libsamplerate-dev libsndfile-dev libsord-dev libxml2-utils qt6-base-dev qt6-base-dev-tools yajl raptor2-utils git mercurial autoconf automake libtool smlnj ninja-build libglib2.0-dev
    - name: install-meson
      run: |
        mkdir -p tmp/meson
        cd tmp/meson
        wget https://github.com/mesonbuild/meson/releases/download/1.3.1/meson-1.3.1.tar.gz
        tar xvf meson-1.3.1.tar.gz
        sudo ln -s $(pwd)/meson-1.3.1/meson.py /usr/bin/meson
    - name: repoint
      run: ./repoint install
    - name: configure
      run: |
        qtchooser -install qt6 $(which qmake6)
        QT_SELECT=qt6 meson setup build --buildtype release
    - name: make
      run: ninja -C build
    - name: test
      run: meson test -C build
